name: test
on:
  pull_request:
    # Only changes that can break the build or the tests. The tests read the user guide.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/guides/user-guide/**'
      - 'Headroom.slnx'
      - 'Directory.Build.props'
      - 'dotnet-tools.json'
      - '.github/workflows/test.yaml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build
        run: dotnet build Headroom.slnx
      # shortcut: one test host still opens about 100 inotify instances without watches (cause unknown).
      # The runner allows 128, so raise the limit. Remove this step when the cause is found.
      - name: Raise the inotify limit
        run: sudo sysctl -w fs.inotify.max_user_instances=1024
      - name: Test
        run: dotnet test Headroom.slnx --no-build
      - name: Check for pending model changes
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Headroom --no-build
