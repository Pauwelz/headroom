name: deploy-test
# Rolls an image onto the Test Instance of the maintainer. It never deploys production.
# A push to main builds the dev image and deploys it. A manual run deploys an existing image and builds nothing.
# The Azure resources and the app settings come from the private repo of the maintainer. This workflow only
# resets the database and starts a new revision with the image. The app migrates and seeds the database at start.
# Run it by hand from the main branch. The release flow is in docs/releasing.md.
on:
  push:
    branches: [main]
    # Only the inputs of the image (see .github/scripts/publish-image.sh). Add a new root build file here.
    # The image job in ci.yaml has the same list. Keep both lists equal.
    # A docs-only merge builds and deploys nothing.
    paths:
      - 'src/**'
      - 'docs/guides/user-guide/**'
      - 'Headroom.slnx'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/scripts/**'
      - '.github/workflows/deploy-test.yaml'
  workflow_dispatch:
    inputs:
      image:
        description: 'dev: the newest main (tag dev). pr: the image of a PR. version: a release.'
        required: true
        type: choice
        options: [dev, pr, version]
        default: dev
      pr:
        description: 'The PR number. Required when image is pr.'
        required: false
        type: string
      version:
        description: 'The release, for example 1.2.3 or 1.2.3-rc.1. Required when image is version.'
        required: false
        type: string
      keep-data:
        description: 'Keep the database and upgrade it. Allowed with image version only. Otherwise the database is reset and seeded.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    # Builds every push to main. One build at a time, in push order, so dev always moves forward.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: dev-image
      cancel-in-progress: false
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      # The full history lets git find the latest tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build and push the image
        id: publish
        env:
          SDK_CONTAINER_REGISTRY_UNAME: ${{ github.actor }}
          SDK_CONTAINER_REGISTRY_PWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          # The dev builds moved here from the workflow dev, whose last run was 25. The offset keeps the number unique.
          VERSION="${base#v}-dev.$((GITHUB_RUN_NUMBER + 25))"
          # dev moves to the newest build. The version tag never moves.
          digest=$(.github/scripts/publish-image.sh "$VERSION" dev "$VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Image ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/headroom:dev, version $VERSION, digest $digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    # A manual run skips image. A push deploys only a successful build.
    if: ${{ !cancelled() && (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.image.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read
    # One deploy at a time: a reset must not run while another run deploys.
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    env:
      # A push deploys the immutable version tag of its own build, not the moving tag dev.
      IMAGE_KIND: ${{ github.event_name == 'push' && 'version' || inputs.image }}
      PR: ${{ inputs.pr }}
      RAW_VERSION: ${{ github.event_name == 'push' && needs.image.outputs.version || inputs.version }}
      KEEP_DATA: ${{ inputs.keep-data || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the image
        env:
          ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
        run: |
          [ "$ENVIRONMENT_NAME" = test ] \
            || { echo "Environment variable ENVIRONMENT_NAME is '$ENVIRONMENT_NAME'. It must be 'test'." >&2; exit 1; }
          [ "$KEEP_DATA" != true ] || [ "$IMAGE_KIND" = version ] \
            || { echo "keep-data is allowed with image version only." >&2; exit 1; }
          repository="${GITHUB_REPOSITORY_OWNER,,}/headroom"
          case "$IMAGE_KIND" in
            dev) tag=dev ;;
            pr)
              [[ "$PR" =~ ^[0-9]+$ ]] || { echo "Image pr needs the input pr: a PR number." >&2; exit 1; }
              tag="pr-$PR" ;;
            version)
              [ -n "$RAW_VERSION" ] || { echo "Image version needs the input version." >&2; exit 1; }
              tag=$(.github/scripts/check-version.sh "$RAW_VERSION") ;;
            *) echo "Image '$IMAGE_KIND' must be dev, pr or version." >&2; exit 1 ;;
          esac
          digest=$(.github/scripts/resolve-digest.sh "$repository" "$tag")
          RESET_DATABASE=true
          [ "$KEEP_DATA" != true ] || RESET_DATABASE=false
          echo "Deploying ghcr.io/$repository:$tag at $digest (database reset: $RESET_DATABASE)" >> "$GITHUB_STEP_SUMMARY"
          { echo "IMAGE=ghcr.io/$repository@$digest"; echo "RESET_DATABASE=$RESET_DATABASE"; } >> "$GITHUB_ENV"

      - name: Sign in to Azure
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          # The token response is JSON with a "value" field. A JWT has no quote characters.
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | sed -n 's/.*"value" *: *"\([^"]*\)".*/\1/p')
          [ -n "$TOKEN" ] || { echo "No OIDC token received" >&2; exit 1; }
          echo "::add-mask::$TOKEN"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$TOKEN" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az extension add --name containerapp --version 0.3.55 --yes --only-show-errors

      - name: Reset the Test Instance database
        if: env.RESET_DATABASE == 'true'
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PG_SERVER: ${{ vars.PG_SERVER }}
          PG_DATABASE: ${{ vars.PG_DATABASE }}
          ENVIRONMENT_NAME: ${{ vars.ENVIRONMENT_NAME }}
        run: |
          # Never reset another Instance. The Environment rules alone are not enough.
          if [ "$ENVIRONMENT_NAME" != test ]; then
            echo "Refused: reset only the Test Instance (ENVIRONMENT_NAME '$ENVIRONMENT_NAME')." >&2
            exit 1
          fi
          [[ "$PG_DATABASE" == *-test-* ]] || { echo "Refused: database '$PG_DATABASE' is not a Test Instance database." >&2; exit 1; }
          pg=(--resource-group "$RESOURCE_GROUP" --server-name "$PG_SERVER" --name "$PG_DATABASE")
          # shortcut: Flexible Server has no rename, so delete first, then create. A failed create leaves no database: rerun the workflow.
          if az postgres flexible-server db show "${pg[@]}" --output none 2>/dev/null; then
            az postgres flexible-server db delete "${pg[@]}" --yes
          fi
          az postgres flexible-server db create "${pg[@]}" --output none

      - name: Roll the image onto the Container App
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.CONTAINER_APP }}
        run: |
          az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE" \
            --query properties.configuration.ingress.fqdn --output tsv
