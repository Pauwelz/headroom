name: Feature request
description: Suggest a change or a new feature.
labels: [needs-triage]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: 'The line at the bottom of the Help page, for example "Headroom 0.1.0 (5f3c2a1)".'
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: 'What can you not do now? Who needs it?'
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
